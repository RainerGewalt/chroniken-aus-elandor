title: "Die Ewigen Chroniken"
tagline: "Märchen und Fantasy-Geschichten aus Elandor"
description: "Entdecke die magische Welt von Elandor: kostenlose Märchen und die Fantasy-Saga „Die Ewigen Chroniken“ über Zeit, Macht und Natur – zum Lesen und Hören."
author:
  name: "Florian Herzog"
lang: de
url: "https://rainergewalt.github.io"
baseurl: "/chroniken-aus-elandor"
# Vorschaubild für Seiten ohne eigenes Cover (Social Media)
default_image: /assets/images/covers/die-ewigen-chroniken-erwachen.jpg

# Deutsche Anführungszeichen („…“) für Markdown-Texte
kramdown:
  smart_quotes: ["sbquo", "lsquo", "bdquo", "ldquo"]

collections:
  pages:
    output: true
  stories:
    output: true
    permalink: /maerchen/:title/
  books:
    output: true
    permalink: /buecher/:name/
  chapters:
    output: true
    permalink: /buecher/:book_slug/:title/

defaults:
  - scope:
      path: ""
      type: "stories"
    values:
      layout: story
  - scope:
      path: ""
      type: "chapters"
    values:
      layout: chapter

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - setup_jekyll.sh
  - scripts/
  - vendor/
  - node_modules/
  - .idea/

plugins:
  - jekyll-sitemap
