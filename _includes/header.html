<header class="site-header" id="header">
    <p class="site-title"><a href="{{ '/' | relative_url }}">{{ site.title }}</a></p>
    <nav class="site-nav" id="site-nav" aria-label="Hauptnavigation">
        <a href="{{ '/' | relative_url }}"{% if page.url == "/" %} class="active" aria-current="page"{% endif %}>Startseite</a>
        <a href="{{ '/maerchen/' | relative_url }}"{% if page.url contains "/maerchen/" %} class="active"{% if page.url == "/maerchen/" %} aria-current="page"{% endif %}{% endif %}>Märchen</a>
        <a href="{{ '/buecher/' | relative_url }}"{% if page.url contains "/buecher/" %} class="active"{% if page.url == "/buecher/" %} aria-current="page"{% endif %}{% endif %}>Abenteuer</a>
        <a href="{{ '/about/' | relative_url }}"{% if page.url == "/about/" %} class="active" aria-current="page"{% endif %}>Über Elandor</a>
        <a href="{{ '/der-autor/' | relative_url }}"{% if page.url == "/der-autor/" %} class="active" aria-current="page"{% endif %}>Der Autor</a>
    </nav>
    <button class="nav-toggle" type="button" aria-controls="site-nav" aria-expanded="false" aria-label="Menü öffnen">⌄</button>
</header>
